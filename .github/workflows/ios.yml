name: iOS

# GitHub Actions, not Xcode Cloud. The sibling app (Retro-C64) ships from an
# Actions job and it is proven end to end; Xcode Cloud needs the project wired
# up in App Store Connect by hand and gives nothing back here that this does
# not already do.
#
# THE APP BUILT HERE IS "DOSDeck", NOT RETRO-DOS.
# Apple rejected the Retro-* family under guideline 4.3 -- several apps from
# one developer, too alike. The answer was not a rename but a separate app:
# its own name, icon, bundle identifier, listing and artwork, sharing only the
# GPL engine underneath. Android keeps Retro-DOS and its own signing key.
#
# SIGNING MATERIAL COMES FROM TWO PLACES, and that is deliberate rather than
# untidy. The certificate, the App Store Connect key and the passwords live in
# ios/signing/*.enc behind the single secret SIGNING_PASSPHRASE. The PROFILE
# does not: DOSDeck's bundle id is new, so its profile post-dates that bundle
# and could not be re-encrypted without the passphrase, which is not in the
# repository and must never be. It is its own secret instead.
#
#   SIGNING_PASSPHRASE      unlocks ios/signing/*.enc  (cert + ASC key)
#   DOSDECK_PROFILE_BASE64  the "DOSDeck AppStore" provisioning profile
#
# Gated on the passphrase being set, so a fork without it still builds -- and
# a broken tree therefore still fails loudly rather than waiting to be noticed.

on:
  push:
    branches: [main]
    tags: ['ios-v*']
  workflow_dispatch:
    inputs:
      only:
        description: "Which half to run"
        type: choice
        default: all
        options: [all, app, screenshots]

env:
  # One place that decides the identity, because the last time these were
  # spelled out per-step the project was renamed and the workflow kept
  # building "RetroDos" against a bundle id that no longer existed.
  APP: DOSDeck
  BUNDLE_ID: com.crownparkcomputing.dosdeck
  TEAM_ID: 88A3T9K9C5
  PROFILE_NAME: DOSDeck AppStore

jobs:
  # ---------------------------------------------------------------- the app
  ios:
    # A capture that needs another attempt should not cost a signed build and
    # a new App Store Connect upload -- the app is identical, only the
    # screenshot job changed.
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'screenshots'
    runs-on: macos-26
    env:
      HAS_IOS_SIGNING: ${{ secrets.SIGNING_PASSPHRASE != '' && secrets.DOSDECK_PROFILE_BASE64 != '' }}

    steps:
      # The core is a submodule and nothing builds without it. ios/build-core.sh
      # stops early and says so rather than failing later inside the compiler,
      # but a checkout without this wastes the whole job.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # macOS ships BSD m4, which autoconf refuses ("no acceptable m4 could be
      # found in $PATH"). cmake and the autotools come from brew; the runner
      # has write access to it, unlike a locked-down workstation.
      - name: Build tools
        run: brew install autoconf automake libtool cmake

      - name: Build the core and frontend
        run: ./ios/build-core.sh

      - name: Decrypt the signing material
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          PASS: ${{ secrets.SIGNING_PASSPHRASE }}
          PROFILE_B64: ${{ secrets.DOSDECK_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/signing"; mkdir -p "$D"; chmod 700 "$D"
          dec() { openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
                    -in "ios/signing/$1" -out "$D/$2" -pass env:PASS; }
          dec dist.p12.enc                dist.p12
          dec asc_key.p8.enc              asc_key.p8
          dec signing.env.enc             signing.env
          # The profile is a secret of its own -- see the header.
          printf '%s' "$PROFILE_B64" | base64 --decode > "$D/profile.mobileprovision"
          echo "D=$D" >> "$GITHUB_ENV"

      # The profile in the secret must be the profile the export expects, and
      # it must be for THIS bundle id. Getting this wrong produces a signed
      # archive that fails at -exportArchive with a message about entitlements
      # that does not name the mismatch.
      - name: Check the profile matches the app
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          plist=$(security cms -D -i "$D/profile.mobileprovision")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<<"$plist")
          appid=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /dev/stdin <<<"$plist")
          echo "profile: $name"
          echo "app id : $appid"
          [ "$name"  = "$PROFILE_NAME" ]            || { echo "::error::profile is '$name', expected '$PROFILE_NAME'"; exit 1; }
          [ "$appid" = "$TEAM_ID.$BUNDLE_ID" ]      || { echo "::error::profile is for $appid, expected $TEAM_ID.$BUNDLE_ID"; exit 1; }

      - name: Import signing certificate
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$D/signing.env"
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"      # no auto-lock mid-build
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$D/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # codesign: in the partition list is the whole point. Without it the
          # key imports, `security find-identity` reports it valid, and every
          # signing attempt fails with errSecInternalComponent -- which reads
          # like a broken certificate and is nothing of the kind.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$D/profile.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      # App Store Connect refuses a CFBundleVersion it has already seen, and
      # says so only AFTER the whole upload has transferred. A UTC timestamp is
      # monotonic without having to ask the server what it already holds.
      - name: Choose a build number
        id: buildno
        run: echo "n=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Configure the app
        run: |
          set -euo pipefail
          if [ "$HAS_IOS_SIGNING" = "true" ]; then
            SIGN_ARGS=(-DRETRODOS_CODE_SIGN_STYLE=Manual
                       -DRETRODOS_PROVISIONING_PROFILE="$PROFILE_NAME"
                       -DRETRODOS_CODE_SIGN_IDENTITY="Apple Distribution")
          else
            SIGN_ARGS=()
          fi
          cmake -S ios -B ios/build/app -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DRETRODOS_BUILD="${{ steps.buildno.outputs.n }}" \
            -DRETRODOS_BUNDLE_ID="$BUNDLE_ID" \
            -DRETRODOS_TEAM_ID="$TEAM_ID" \
            "${SIGN_ARGS[@]+"${SIGN_ARGS[@]}"}"

      # xcodebuild archive, and signing lives on the target (set in
      # CMakeLists.txt) rather than on this command line, because a
      # command-line PROVISIONING_PROFILE_SPECIFIER applies to EVERY target.
      - name: Archive
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "ios/build/app/$APP.xcodeproj" -scheme "$APP" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "build/$APP.xcarchive"

      # Unsigned builds still have to compile and produce a bundle, or a broken
      # tree goes unnoticed until someone adds the secrets.
      - name: Build (unsigned, no secrets configured)
        if: env.HAS_IOS_SIGNING != 'true'
        run: |
          xcodebuild -project "ios/build/app/$APP.xcodeproj" -scheme "$APP" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      # An upload can report "UPLOAD SUCCEEDED", be given a delivery UUID, and
      # then be discarded in processing -- by email, with CI green and no build
      # ever appearing. A missing icon key and a missing purpose string both do
      # exactly that, so they are checked in the BUILT bundle, not the source.
      - name: Verify the bundle cannot be discarded in processing
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          app="build/$APP.xcarchive/Products/Applications/$APP.app"
          plist="$app/Info.plist"
          need() {
            /usr/bin/plutil -extract "$1" raw -o - "$plist" >/dev/null 2>&1 \
              || { echo "::error::$1 is missing from the built bundle"; exit 1; }
          }
          need CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName
          need ITSAppUsesNonExemptEncryption

          # The shipped app must not still call itself Retro-DOS anywhere a
          # reviewer can see: that leftover is precisely what guideline 4.3
          # reads as one app submitted twice.
          for key in CFBundleDisplayName CFBundleName; do
            v=$(/usr/bin/plutil -extract "$key" raw -o - "$plist")
            echo "  $key = $v"
            case "$v" in *Retro*) echo "::error::$key is '$v'"; exit 1 ;; esac
          done

          # Purpose strings, derived from what the BINARY links rather than from
          # a list somebody remembered to update. A bundle that links a
          # protected API needs the string whether or not it calls it, and
          # Apple reports the lack only after a delivery that reported success
          # -- ITMS-90683, by email, hours later, with the job green. That is
          # how the first 2.0 upload was lost.
          bin="$app/$APP"
          check_api() {   # <objc class> <Info.plist key>
            if nm -u "$bin" 2>/dev/null | grep -q "$1"; then
              need "$2"
              echo "  $1 is linked -> $2 present"
            fi
          }
          check_api CBCentralManager NSBluetoothAlwaysUsageDescription
          check_api AVCaptureDevice  NSCameraUsageDescription
          check_api AVAudioSession   NSMicrophoneUsageDescription
          check_api CLLocationManager NSLocationWhenInUseUsageDescription
          check_api PHPhotoLibrary   NSPhotoLibraryUsageDescription
          check_api CNContactStore   NSContactsUsageDescription
          echo "bundle looks deliverable"

      - name: Export the IPA
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "build/$APP.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath build/ipa

      - name: Keep the IPA
        if: env.HAS_IOS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/ipa/*.ipa
          if-no-files-found: error

      - name: Upload to App Store Connect
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$D/signing.env"
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$D/asc_key.p8" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          # altool says "No suitable application records were found" when the
          # App Store record for this bundle id does not exist. That is not a
          # build problem: the record cannot be created from any API key --
          # app creation is a web-session operation only -- so it is made once
          # by hand and every upload afterwards works.
          if ! xcrun altool --upload-app -f build/ipa/*.ipa -t ios \
                 --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee /tmp/altool.log; then
            if grep -qi "no suitable application record" /tmp/altool.log; then
              echo "::error::No App Store record for $BUNDLE_ID. Create it once (asc web apps create), then re-run."
            fi
            exit 1
          fi

  # -------------------------------------------------------- the store shots
  # A separate job because it needs a SIMULATOR slice of the core, which is a
  # different configured tree with a different SDK -- not another arch of the
  # device build -- and because a screenshot problem should not cost a
  # release. It signs nothing and uploads nothing to Apple.
  screenshots:
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'app'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build tools
        run: |
          brew install autoconf automake libtool cmake
          python3 -m pip install --break-system-packages --quiet pillow

      - name: Build the core and frontend (simulator)
        run: IOS_PLATFORM=iphonesimulator ./ios/build-core.sh

      - name: Build the app (simulator, unsigned)
        run: |
          set -euo pipefail
          cmake -S ios -B ios/build/sim -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DRETRODOS_LIB_PLATFORM=iphonesimulator \
            -DRETRODOS_BUNDLE_ID="$BUNDLE_ID" -DRETRODOS_TEAM_ID="$TEAM_ID"
          xcodebuild -project "ios/build/sim/$APP.xcodeproj" -scheme "$APP" \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Capture
        run: |
          set -euo pipefail
          APP_PATH=$(find ios/build/sim -name "$APP.app" -type d | head -1)
          [ -n "$APP_PATH" ] || { echo "::error::no $APP.app was built"; exit 1; }
          echo "app: $APP_PATH"
          tool/capture-screenshots.sh "$APP_PATH"

      - name: Size them for App Store Connect
        run: |
          set -euo pipefail
          tool/make-store-screenshots.py store/screenshots-raw-iphone
          tool/make-store-screenshots.py store/screenshots-raw-ipad

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            store/screenshots
            store/screenshots-raw-iphone
            store/screenshots-raw-ipad
          if-no-files-found: error
